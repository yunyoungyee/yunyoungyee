<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Yunyoung Kim — Frontend Engineer</title>
  <desc id="description">A dark profile card introducing Yunyoung Kim as a frontend engineer.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827" />
      <stop offset="1" stop-color="#0D1117" />
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="278" rx="6" fill="url(#background)" stroke="#293244" stroke-width="2" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', Arial, sans-serif">
    <!-- Greeting -->
    <text x="70" y="82" fill="#7088FF" font-size="15" font-weight="600" letter-spacing="4">HELLO THERE</text>
    <text x="228" y="82" fill="#F5C451" font-size="18">👋</text>

    <!-- Name and description -->
    <text x="70" y="150" fill="#F5F7FB" font-size="43" font-weight="700" letter-spacing="-1.4">I'm Yunyoung Kim</text>
    <text x="70" y="202" fill="#AAB2C3" font-size="21" font-weight="400">Frontend Engineer</text>
  </g>
</svg>
